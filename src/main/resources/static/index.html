<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAtende AI</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="auth" class="auth-card hidden">
        <h1>SmartAtende AI</h1>

        <div class="tabs">
            <button id="tab-login" class="tab active" onclick="mostrarLogin()">Entrar</button>
            <button id="tab-register" class="tab" onclick="mostrarRegistro()">Cadastrar</button>
        </div>

        <form id="form-login" class="form" onsubmit="event.preventDefault(); login();">
            <input id="login-email" type="email" placeholder="E-mail" autocomplete="email" maxlength="255" required>
            <input id="login-senha" type="password" placeholder="Senha" autocomplete="current-password" maxlength="72" required>
            <button type="submit">Entrar</button>
            <p id="auth-msg-login" class="msg"></p>
        </form>

        <form id="form-register" class="form hidden" onsubmit="event.preventDefault(); registrar();">
            <input id="reg-nome" type="text" placeholder="Nome" autocomplete="name" maxlength="120" required>
            <input id="reg-email" type="email" placeholder="E-mail" autocomplete="email" maxlength="255" required>
            <input id="reg-senha" type="password" placeholder="Senha (mínimo 8 caracteres)" autocomplete="new-password" minlength="8" maxlength="72" required>
            <button type="submit">Criar conta</button>
            <p id="auth-msg-register" class="msg"></p>
        </form>
    </section>

    <section id="chat-app" class="chat-container hidden">
        <div class="chat-header">
            <h1>SmartAtende AI</h1>
            <div class="user-info">
                <span id="usuario-email"></span>
                <button class="logout" onclick="novaConversa()">Nova conversa</button>
                <button class="logout" onclick="logout()">Sair</button>
            </div>
        </div>

        <div id="chat-box" aria-live="polite"></div>

        <div class="input-area">
            <input
                type="text"
                id="mensagem"
                placeholder="Digite sua pergunta"
                maxlength="4000"
                autofocus>

            <button id="btn-enviar" onclick="enviarMensagem()">
                Enviar
            </button>
        </div>
    </section>

    <script src="app.js"></script>

</body>
</html>
