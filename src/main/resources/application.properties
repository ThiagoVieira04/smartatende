spring.application.name=smartatende
spring.profiles.default=dev

server.port=${PORT:8080}
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/plain
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
app.ai.history-limit=20
app.ai.history-max-chars=12000

spring.ai.openai.timeout=30s
spring.ai.openai.max-retries=0

app.ai.retry.max-retries=2
app.ai.retry.backoff-initial=500ms
app.ai.retry.backoff-multiplier=2
app.ai.retry.backoff-max=2s

app.ai.circuit-breaker.failure-threshold=5
app.ai.circuit-breaker.open-duration=30s

app.rate-limit.enabled=true
app.rate-limit.window=60s
app.rate-limit.auth-per-minute=20
app.rate-limit.chat-per-minute=30

app.security.metrics-public=true

spring.ai.openai.base-url=${OPENAI_BASE_URL:https://opencode.ai/zen/v1}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:deepseek-v4.1-flash-free}

management.endpoints.web.exposure.include=health,info,metrics
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=when-authorized
management.endpoint.health.show-details=when-authorized

info.app.name=SmartAtende AI
info.app.description=API de atendimento inteligente

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId:-}] --- [%t] %-40.40logger{39} : %m%n
