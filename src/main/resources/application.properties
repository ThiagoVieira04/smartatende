spring.application.name=smartatende
spring.profiles.default=dev

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.jwt.expiration-ms=86400000
app.ai.history-limit=20

spring.ai.openai.timeout=30s
spring.ai.openai.max-retries=0

app.ai.retry.max-retries=2
app.ai.retry.backoff-initial=500ms
app.ai.retry.backoff-multiplier=2
app.ai.retry.backoff-max=2s

app.ai.circuit-breaker.failure-threshold=5
app.ai.circuit-breaker.open-duration=30s

spring.ai.openai.base-url=https://opencode.ai/zen/v1
spring.ai.openai.chat.options.model=deepseek-v4.1-flash-free

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=when-authorized
management.endpoint.health.show-details=when-authorized

info.app.name=SmartAtende AI
info.app.description=API de atendimento inteligente
