spring.datasource.url=jdbc:h2:mem:smartatende;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

app.jwt.secret=test-secret-key-for-smartatende-tests-0123456789

management.endpoint.health.show-components=always
management.endpoint.health.show-details=always

app.ai.retry.max-retries=2
app.ai.retry.backoff-initial=10ms
app.ai.retry.backoff-multiplier=2
app.ai.retry.backoff-max=50ms

app.ai.circuit-breaker.failure-threshold=2
app.ai.circuit-breaker.open-duration=30s

spring.ai.openai.api-key=test-key
