services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartatende
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d smartatende"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/smartatende
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:?Defina OPENCODE_API_KEY no arquivo .env}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://opencode.ai/zen/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4.1-flash-free}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
