$kind: http-request
name: Chat - Limpar historico da sessao
url: "{{baseUrl}}/api/chat/historico"
method: DELETE
queryParams:
  - key: sessao
    value: "{{sessao}}"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 204", () => pm.response.to.have.status(204));
    language: text/javascript
order: 5500
