$kind: http-request
name: Auth - Me
url: "{{baseUrl}}/api/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const dados = pm.response.json();
      pm.test("Retorna o e-mail autenticado", () => pm.expect(dados.email).to.be.a("string"));
    language: text/javascript
order: 3000
